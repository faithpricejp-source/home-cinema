<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeCinema</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">HomeCinema</a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">首页</a>
      <a href="#/movies" data-nav="movies">电影</a>
      <a href="#/shows" data-nav="shows">剧集</a>
    </nav>
    <div class="tools">
      <input id="search" type="search" placeholder="搜索片名…" autocomplete="off" spellcheck="false">

<main id="view" class="view"></main>

<script src="/static/app.js"></script>

</html>
